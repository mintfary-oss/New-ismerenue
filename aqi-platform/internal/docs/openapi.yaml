openapi: 3.1.0
info:
  title: AQI Platform API
  description: |
    **Платформа мониторинга качества воздуха города Кемерово.**

    Предоставляет:
    - Получение измерений с датчиков (PM2.5, NO2, SO2, CO, O3, H2S)
    - Расчёт индекса AQI по методологии US EPA
    - Прогноз качества воздуха на 6 часов (EWMA + IDW)
    - Публичный виджет для встраивания на городской сайт
    - Управление пользователями, датчиками, отчётами

    ### Аутентификация
    Все `/api/v1/*` эндпоинты (кроме `/api/v1/auth/*` и `/api/v1/public/*`)
    требуют Bearer JWT токен в заголовке `Authorization`.

    ### Роли
    | Роль      | Описание                          |
    |-----------|-----------------------------------|
    | `admin`   | Полный доступ                     |
    | `analyst` | Чтение данных, создание отчётов   |
    | `viewer`  | Только чтение                     |
  version: "1.0.0"
  contact:
    name: AQI Platform Support
    email: support@aqi-platform.local
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Локальная разработка
  - url: https://aqi.kemerovo.ru
    description: Продуктивная среда

tags:
  - name: Health
    description: Проверка работоспособности
  - name: Auth
    description: Аутентификация и управление токенами
  - name: Users
    description: Управление пользователями (только Admin)
  - name: Sensors
    description: Управление датчиками
  - name: Measurements
    description: Получение измерений
  - name: Forecast
    description: Прогнозы качества воздуха
  - name: Ingest
    description: Загрузка данных от датчиков
  - name: Reports
    description: Генерация и скачивание отчётов (Admin/Analyst)
  - name: Stats
    description: Статистика платформы (только Admin)
  - name: Feedback
    description: Обратная связь
  - name: Tokens
    description: API-токены пользователя
  - name: Widget
    description: Публичный виджет (без авторизации)

# ── Компоненты ────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Общие
    Error:
      type: object
      properties:
        error:
          type: string
          example: "не найдено"
        code:
          type: string
          example: "not_found"
      required: [error]

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # Пользователи
    UserRole:
      type: string
      enum: [admin, analyst, viewer]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required: [id, email, username, role, is_active, created_at]

    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 2
          maxLength: 50
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/UserRole'
      required: [email, username, password, role]

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 50
        role:
          $ref: '#/components/schemas/UserRole'
        is_active:
          type: boolean

    # Датчики
    SensorType:
      type: string
      enum: [gas, dust, combo]
      description: |
        - `gas` — газоанализатор (NO2, O3, CO, H2S, SO2)
        - `dust` — пылемер (PM2.5)
        - `combo` — комбинированный

    Sensor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        type:
          $ref: '#/components/schemas/SensorType'
        is_active:
          type: boolean
        last_seen:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [id, name, address, lat, lng, type, is_active, created_at]

    SensorStatus:
      type: object
      properties:
        sensor_id:
          type: string
          format: uuid
        name:
          type: string
        is_active:
          type: boolean
        is_online:
          type: boolean
          description: "true если данные поступали в течение последних 30 минут"
        last_seen:
          type: string
          format: date-time
          nullable: true

    CreateSensorRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        address:
          type: string
          minLength: 5
          maxLength: 255
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        type:
          $ref: '#/components/schemas/SensorType'
      required: [name, address, lat, lng, type]

    UpdateSensorRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        lat:
          type: number
        lng:
          type: number
        type:
          $ref: '#/components/schemas/SensorType'
        is_active:
          type: boolean

    # Измерения
    Measurement:
      type: object
      properties:
        time:
          type: string
          format: date-time
        sensor_id:
          type: string
          format: uuid
        no2:
          type: number
          nullable: true
          description: "мг/м³"
        o3:
          type: number
          nullable: true
          description: "мг/м³"
        co:
          type: number
          nullable: true
          description: "мг/м³"
        h2s:
          type: number
          nullable: true
          description: "мг/м³"
        so2:
          type: number
          nullable: true
          description: "мг/м³"
        pm25:
          type: number
          nullable: true
          description: "мг/м³"
        temperature:
          type: number
          nullable: true
          description: "°C"
        humidity:
          type: number
          nullable: true
          description: "%"
        pressure:
          type: number
          nullable: true
          description: "гПа"
        wind_speed:
          type: number
          nullable: true
          description: "м/с"
        wind_dir:
          type: number
          nullable: true
          description: "градусы (0–360)"

    MeasurementInput:
      type: object
      properties:
        sensor_id:
          type: string
          format: uuid
        time:
          type: string
          format: date-time
        no2:
          type: number
          nullable: true
        o3:
          type: number
          nullable: true
        co:
          type: number
          nullable: true
        h2s:
          type: number
          nullable: true
        so2:
          type: number
          nullable: true
        pm25:
          type: number
          nullable: true
        temperature:
          type: number
          nullable: true
        humidity:
          type: number
          nullable: true
        pressure:
          type: number
          nullable: true
        wind_speed:
          type: number
          nullable: true
        wind_dir:
          type: number
          nullable: true
      required: [sensor_id]

    AggregatedMeasurement:
      type: object
      properties:
        bucket:
          type: string
          format: date-time
        sensor_id:
          type: string
          format: uuid
        avg_no2:
          type: number
          nullable: true
        avg_o3:
          type: number
          nullable: true
        avg_co:
          type: number
          nullable: true
        avg_h2s:
          type: number
          nullable: true
        avg_so2:
          type: number
          nullable: true
        avg_pm25:
          type: number
          nullable: true
        max_no2:
          type: number
          nullable: true
        max_pm25:
          type: number
          nullable: true
        data_points:
          type: integer

    LatestMeasurement:
      type: object
      properties:
        sensor:
          $ref: '#/components/schemas/Sensor'
        measurement:
          $ref: '#/components/schemas/Measurement'
        aqi:
          type: integer
          description: "Индекс качества воздуха (0–500)"
        aqi_category:
          $ref: '#/components/schemas/AQICategory'

    AQICategory:
      type: string
      enum: [good, moderate, unhealthy, bad, very_bad, hazardous]
      description: |
        - `good` — Хорошее (AQI 0–50)
        - `moderate` — Умеренное (AQI 51–100)
        - `unhealthy` — Нездоровое для чувствительных (AQI 101–150)
        - `bad` — Нездоровое (AQI 151–200)
        - `very_bad` — Очень нездоровое (AQI 201–300)
        - `hazardous` — Опасное (AQI 301+)

    # Прогнозы
    ForecastPoint:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        district:
          type: string

    Forecast:
      type: object
      properties:
        time:
          type: string
          format: date-time
        point_id:
          type: string
        lat:
          type: number
        lng:
          type: number
        horizon_hours:
          type: integer
          description: "Горизонт прогноза в часах (0, 1, 2, 3, 6)"
        aqi:
          type: integer
        aqi_category:
          $ref: '#/components/schemas/AQICategory'
        no2_forecast:
          type: number
          nullable: true
        pm25_forecast:
          type: number
          nullable: true
        so2_forecast:
          type: number
          nullable: true
        model_version:
          type: string
        created_at:
          type: string
          format: date-time

    CityForecast:
      type: object
      properties:
        time:
          type: string
          format: date-time
        city_aqi:
          type: integer
        city_category:
          $ref: '#/components/schemas/AQICategory'
        districts:
          type: array
          items:
            type: object
            properties:
              district_id:
                type: string
              district_name:
                type: string
              aqi:
                type: integer
              aqi_category:
                $ref: '#/components/schemas/AQICategory'
        points:
          type: array
          items:
            $ref: '#/components/schemas/Forecast'

    # Токены
    APIToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: "Первые 8 символов токена"
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true

    CreateTokenRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required: [name]

    CreateTokenResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token:
          type: string
          description: "Токен в формате aqi_<hex64>. Показывается ОДИН РАЗ!"
        prefix:
          type: string
        created_at:
          type: string
          format: date-time

    # Auth
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: "Секунд до истечения access_token"
        user:
          $ref: '#/components/schemas/User'

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8
      required: [token, new_password]

    # Отчёты
    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [daily, monthly, custom]
        format:
          type: string
          enum: [csv, xlsx]
        period_from:
          type: string
          format: date-time
        period_to:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, ready, error]
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    GenerateReportRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [daily, monthly, custom]
        format:
          type: string
          enum: [csv, xlsx]
        period_from:
          type: string
          format: date-time
        period_to:
          type: string
          format: date-time
        sensor_ids:
          type: array
          items:
            type: string
            format: uuid
      required: [name, type, format, period_from, period_to]

    # Статистика
    AvailabilityStats:
      type: object
      properties:
        sensor_id:
          type: string
          format: uuid
        sensor_name:
          type: string
        total_hours:
          type: integer
        online_hours:
          type: integer
        availability_percent:
          type: number
          format: double

    DataCoverageStats:
      type: object
      properties:
        sensor_id:
          type: string
          format: uuid
        parameter:
          type: string
        coverage_percent:
          type: number
          format: double
        total_records:
          type: integer

    # Обратная связь
    Feedback:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        subject:
          type: string
        message:
          type: string
        created_at:
          type: string
          format: date-time

    CreateFeedbackRequest:
      type: object
      properties:
        subject:
          type: string
          maxLength: 200
        message:
          type: string
          maxLength: 5000
      required: [subject, message]

# ── Security по умолчанию ─────────────────────────────────────────────────────
security:
  - BearerAuth: []

# ── Пути ─────────────────────────────────────────────────────────────────────
paths:
  # Health
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Возвращает 200 если процесс запущен
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  time:
                    type: string
                    format: date-time

  /ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Возвращает 200 если все зависимости (БД) готовы
      security: []
      responses:
        '200':
          description: Все зависимости готовы
        '503':
          description: Одна или более зависимостей недоступны

  # Auth
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Авторизация
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Слишком много попыток, аккаунт заблокирован

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Обновление access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Refresh token недействителен или истёк

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Выход (инвалидация токена)
      responses:
        '204':
          description: Успешный выход

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Запрос сброса пароля
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Письмо отправлено (если email существует)

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Установка нового пароля по токену
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Пароль изменён
        '400':
          description: Токен недействителен или истёк

  # Users (Admin only)
  /api/v1/users:
    get:
      tags: [Users]
      summary: Список пользователей
      description: Только Admin
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '403':
          description: Недостаточно прав
    post:
      tags: [Users]
      summary: Создание пользователя
      description: Только Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Email уже занят

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Users]
      summary: Получение пользователя
      description: Только Admin
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Не найден
    patch:
      tags: [Users]
      summary: Обновление пользователя
      description: Только Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Обновлённый пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags: [Users]
      summary: Удаление пользователя
      description: Только Admin
      responses:
        '204':
          description: Удалён

  # Sensors
  /api/v1/sensors:
    get:
      tags: [Sensors]
      summary: Список датчиков
      parameters:
        - name: active_only
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Список датчиков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sensor'
    post:
      tags: [Sensors]
      summary: Создание датчика
      description: Только Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSensorRequest'
      responses:
        '201':
          description: Датчик создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'

  /api/v1/sensors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Sensors]
      summary: Получение датчика
      responses:
        '200':
          description: Датчик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '404':
          description: Не найден
    patch:
      tags: [Sensors]
      summary: Обновление датчика
      description: Только Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSensorRequest'
      responses:
        '200':
          description: Обновлённый датчик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
    delete:
      tags: [Sensors]
      summary: Удаление датчика
      description: Только Admin
      responses:
        '204':
          description: Удалён

  /api/v1/sensors/{id}/status:
    get:
      tags: [Sensors]
      summary: Статус датчика (онлайн/оффлайн)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Статус
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorStatus'

  # Measurements
  /api/v1/measurements:
    get:
      tags: [Measurements]
      summary: Список измерений
      parameters:
        - name: sensor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: period
          in: query
          schema:
            type: string
            enum: [raw, 1h, 1d]
            default: raw
        - name: limit
          in: query
          schema:
            type: integer
            default: 1000
            maximum: 10000
      responses:
        '200':
          description: Измерения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Measurement'

  /api/v1/measurements/latest:
    get:
      tags: [Measurements]
      summary: Последние измерения по всем датчикам
      responses:
        '200':
          description: Текущее состояние всех датчиков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LatestMeasurement'

  /api/v1/measurements/aggregate:
    get:
      tags: [Measurements]
      summary: Агрегированные данные за период
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: bucket
          in: query
          schema:
            type: string
            enum: [1h, 1d]
            default: 1h
      responses:
        '200':
          description: Агрегированные данные
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AggregatedMeasurement'

  # Forecast (public)
  /api/v1/public/forecast/current:
    get:
      tags: [Forecast]
      summary: Текущий прогноз для всех точек
      security: []
      responses:
        '200':
          description: Прогнозы для 4 точек Кемерово
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Forecast'

  /api/v1/public/forecast/city-average:
    get:
      tags: [Forecast]
      summary: Агрегированный прогноз по городу и районам
      security: []
      responses:
        '200':
          description: Прогноз по городу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityForecast'

  /api/v1/public/forecast/points:
    get:
      tags: [Forecast]
      summary: Список точек мониторинга
      security: []
      responses:
        '200':
          description: Точки мониторинга
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ForecastPoint'

  # Forecast (authenticated)
  /api/v1/forecast/{point_id}:
    get:
      tags: [Forecast]
      summary: Прогноз по конкретной точке (все горизонты)
      parameters:
        - name: point_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Прогнозы по горизонтам
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Forecast'

  /api/v1/forecast/district/{id}:
    get:
      tags: [Forecast]
      summary: Прогноз по всем точкам района
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Прогнозы района
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Forecast'

  # Ingest
  /api/v1/ingest/data:
    post:
      tags: [Ingest]
      summary: Загрузка данных от датчика (JSON или CSV/XLSX файл)
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/MeasurementInput'
                - type: array
                  items:
                    $ref: '#/components/schemas/MeasurementInput'
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Данные приняты
        '400':
          description: Ошибка валидации

  # Tokens
  /api/v1/tokens:
    get:
      tags: [Tokens]
      summary: Список API-токенов пользователя
      responses:
        '200':
          description: Список токенов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIToken'
    post:
      tags: [Tokens]
      summary: Создание API-токена
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: Токен создан (raw-значение показывается только один раз)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTokenResponse'

  /api/v1/tokens/{id}:
    delete:
      tags: [Tokens]
      summary: Отзыв API-токена
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Токен отозван

  # Reports
  /api/v1/reports:
    get:
      tags: [Reports]
      summary: Список отчётов
      responses:
        '200':
          description: Список отчётов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'

  /api/v1/reports/generate:
    post:
      tags: [Reports]
      summary: Генерация отчёта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateReportRequest'
      responses:
        '202':
          description: Отчёт поставлен в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'

  /api/v1/reports/{id}/download:
    get:
      tags: [Reports]
      summary: Скачивание готового отчёта
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: CSV/XLSX файл
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '404':
          description: Отчёт не найден или ещё не готов

  # Stats
  /api/v1/stats/availability:
    get:
      tags: [Stats]
      summary: Статистика доступности датчиков
      description: Только Admin
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Статистика доступности
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilityStats'

  /api/v1/stats/data-coverage:
    get:
      tags: [Stats]
      summary: Покрытие данных по параметрам
      description: Только Admin
      responses:
        '200':
          description: Покрытие данных
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataCoverageStats'

  # Feedback
  /api/v1/feedback:
    post:
      tags: [Feedback]
      summary: Отправка обратной связи
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeedbackRequest'
      responses:
        '201':
          description: Обращение принято
    get:
      tags: [Feedback]
      summary: Список обращений (только Admin)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Список обращений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feedback'

  # Widget (public, no auth)
  /widget/:
    get:
      tags: [Widget]
      summary: HTML виджет для встраивания в iframe
      security: []
      responses:
        '200':
          description: HTML страница виджета
          content:
            text/html:
              schema:
                type: string

  /widget/data:
    get:
      tags: [Widget]
      summary: JSON данные для виджета (последние AQI)
      security: []
      responses:
        '200':
          description: Текущие показания
          content:
            application/json:
              schema:
                type: object

  /widget/forecast:
    get:
      tags: [Widget]
      summary: JSON прогноз для виджета
      security: []
      responses:
        '200':
          description: Прогноз
          content:
            application/json:
              schema:
                type: object
