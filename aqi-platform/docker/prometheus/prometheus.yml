# Prometheus — конфигурация для AQI Platform
# Собирает метрики с Go-приложения каждые 15 секунд.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'aqi-kemerovo'
    environment: 'production'

# Правила алертов (файл создаётся автоматически при сборке контейнера)
rule_files:
  - /etc/prometheus/rules/*.yml

# Получатели алертов (Alertmanager — опционально)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  # ── AQI Platform (Go API) ────────────────────────────────────────────────
  - job_name: 'aqi-platform'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['app:8080']
        labels:
          service: 'aqi-platform-api'
    metrics_path: '/metrics'

  # ── PostgreSQL (via postgres_exporter) ───────────────────────────────────
  # Раскомментировать если добавить postgres_exporter в docker-compose
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # ── Redis (via redis_exporter) ────────────────────────────────────────────
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # ── Nginx (via nginx-exporter) ────────────────────────────────────────────
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx-exporter:9113']

  # ── Сам Prometheus ────────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
