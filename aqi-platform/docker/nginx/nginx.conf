worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# Ограничение числа открытых файловых дескрипторов
worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Безопасность ─────────────────────────────────────────────────────────
    # Скрываем версию Nginx
    server_tokens off;
    # Запрет обработки запросов к неизвестным хостам
    # (защита от сканеров и прямых запросов по IP без Host-заголовка)
    server_name_in_redirect off;

    # ── Rate Limiting (защита от DDoS и брутфорса) ────────────────────────────
    # Zone для API (ограничение по IP): 10 МБ зоны хватает на ~160 000 уникальных IP
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m    rate=60r/m;
    # Zone для аутентификации: жёсткое ограничение
    limit_req_zone  $binary_remote_addr  zone=auth_limit:10m   rate=10r/m;
    # Zone для виджета: более мягкое ограничение (публичный трафик)
    limit_req_zone  $binary_remote_addr  zone=widget_limit:10m rate=120r/m;
    # Zone для Grafana
    limit_req_zone  $binary_remote_addr  zone=grafana_limit:5m rate=30r/m;

    # Ограничение числа одновременных соединений с одного IP
    limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

    # Статус-код при превышении лимита (429 = Too Many Requests, RFC 6585)
    limit_req_status  429;
    limit_conn_status 429;

    # ── Логирование ───────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"referer":"$http_referer",'
            '"ua":"$http_user_agent",'
            '"x_request_id":"$http_x_request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Производительность ────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    reset_timedout_connection on;

    # Сжатие (включаем wasm для MapLibre)
    gzip              on;
    gzip_types        text/plain application/json application/javascript
                      text/css application/xml text/javascript
                      application/wasm image/svg+xml;
    gzip_min_length   1024;
    gzip_comp_level   4;
    gzip_vary         on;

    # ── Защита от медленных атак (Slowloris и др.) ────────────────────────────
    client_body_timeout    12;
    client_header_timeout  12;
    send_timeout           10;
    client_max_body_size   10M;
    client_body_buffer_size 16k;

    # Буферизация upstream-ответов (предотвращает накопление соединений)
    proxy_buffering    on;
    proxy_buffer_size  8k;
    proxy_buffers      8 8k;

    # ── Upstream ─────────────────────────────────────────────────────────────
    upstream aqi_app {
        server app:8080;
        keepalive 32;
        # Если upstream не отвечает 3 раза — помечаем как недоступный на 30 сек
        # (nginx отдаст 502, не будет зависать в ожидании)
    }

    upstream aqi_grafana {
        server grafana:3000;
        keepalive 8;
    }

    # ── HTTP → HTTPS редирект ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Health check: возвращает 200 напрямую без TLS и без редиректа.
        # Используется Docker healthcheck (wget http://127.0.0.1/health).
        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
            access_log off;
        }

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS (основной сервер) ────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # ── TLS ───────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ssl_stapling отключён: не работает с самоподписанным сертификатом.
        # Включить только при наличии сертификата от доверенного CA (Let's Encrypt).

        # ── Заголовки безопасности ────────────────────────────────────────────
        # HSTS без preload: браузер использует только HTTPS, но не попадает
        # в глобальный preload-список (что важно пока используется self-signed cert).
        add_header Strict-Transport-Security "max-age=3600"                                        always;
        add_header X-Content-Type-Options    "nosniff"                                             always;
        add_header X-Frame-Options           "SAMEORIGIN"                                          always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"                     always;

        # ── Лимиты соединений ─────────────────────────────────────────────────
        # Не более 20 одновременных соединений с одного IP
        limit_conn conn_limit 20;

        # ── Аутентификация → жёсткое rate limiting ────────────────────────────
        location /api/v1/auth/ {
            # burst=5: допустимо 5 запросов "в долг", без задержки
            # nodelay: не задерживаем, а сразу отдаём 429 при превышении
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass         http://aqi_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   Connection        "";

            proxy_connect_timeout  10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;

            # Заголовок Retry-After при 429
            add_header Retry-After 60 always;
        }

        # ── API (общий лимит) ─────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://aqi_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   Connection        "";

            proxy_connect_timeout  60s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }

        # ── Виджет (публичный, мягкий лимит) ─────────────────────────────────
        location /widget/ {
            limit_req zone=widget_limit burst=30 nodelay;

            proxy_pass         http://aqi_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Виджет кэшируем на 60 секунд (снижает нагрузку)
            proxy_cache_valid  200 60s;
        }

        # ── Prometheus метрики (только приложение, без nginx-level лимита) ────
        # /metrics — проксируем к Go-приложению. Закрыть для внешнего доступа
        # можно добавив: allow 10.0.0.0/8; deny all;
        location = /metrics {
            proxy_pass http://aqi_app;
            access_log off;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location = /health {
            proxy_pass http://aqi_app;
            access_log off;
        }

        location = /ready {
            proxy_pass http://aqi_app;
            access_log off;
        }

        # ── Grafana ───────────────────────────────────────────────────────────
        location /grafana/ {
            limit_req zone=grafana_limit burst=10 nodelay;

            proxy_pass         http://aqi_grafana;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket для live-обновлений Grafana
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_read_timeout 300s;
        }

        # ── React SPA (статика) ───────────────────────────────────────────────
        # Файлы с хешем в имени — кэшируем на год
        location ~* \.(js|css|woff2?|ttf|ico|png|jpg|svg|wasm)$ {
            root    /var/www/spa;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Все остальные запросы → index.html (SPA-роутинг)
        location / {
            root      /var/www/spa;
            index     index.html;
            try_files $uri $uri/ /index.html;

            # index.html не кэшируем — браузер всегда должен получать свежий
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
