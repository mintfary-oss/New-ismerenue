worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Безопасность: скрываем версию Nginx
    server_tokens off;

    # Логирование в JSON для удобной обработки
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"referer":"$http_referer",'
            '"ua":"$http_user_agent",'
            '"x_request_id":"$http_x_request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # Производительность
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;

    # Сжатие (включаем wasm для MapLibre)
    gzip              on;
    gzip_types        text/plain application/json application/javascript
                      text/css application/xml text/javascript
                      application/wasm image/svg+xml;
    gzip_min_length   1024;
    gzip_comp_level   4;

    # Защита от медленных атак
    client_body_timeout    12;
    client_header_timeout  12;
    send_timeout           10;
    client_max_body_size   10M;

    # Upstream — Go-приложение
    upstream aqi_app {
        server app:8080;
        keepalive 32;
    }

    # Upstream — Grafana
    upstream aqi_grafana {
        server grafana:3000;
        keepalive 8;
    }

    # ── HTTP → HTTPS редирект ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # TLS сертификаты (Let's Encrypt или самоподписанные)
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Только современные TLS (TLS 1.2 + TLS 1.3)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS (1 год)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Безопасные заголовки
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── API и виджет → Go-бэкенд ─────────────────────────────────────────
        location /api/ {
            proxy_pass         http://aqi_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $request_id;

            proxy_connect_timeout  60s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }

        location /widget/ {
            proxy_pass         http://aqi_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Health check без логирования (уменьшает шум в логах)
        location = /health {
            proxy_pass http://aqi_app;
            access_log off;
        }

        # ── Grafana (только для внутренней сети / admin) ──────────────────────
        # Доступна по /grafana/ — проксируем в Grafana-контейнер.
        # Для продакшна рекомендуется ограничить доступ по IP или Basic Auth.
        location /grafana/ {
            proxy_pass         http://aqi_grafana;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket для live-обновлений Grafana
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # ── React SPA ─────────────────────────────────────────────────────────
        # Статические файлы с длинным кэшем (Vite добавляет хеш в имена)
        location ~* \.(js|css|woff2?|ttf|ico|png|jpg|svg|wasm)$ {
            root    /var/www/spa;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Все остальные запросы → index.html (SPA-роутинг)
        location / {
            root      /var/www/spa;
            index     index.html;
            try_files $uri $uri/ /index.html;

            # index.html не кэшируем — браузер всегда должен получать свежий
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
