worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    server_name_in_redirect off;

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m    rate=60r/m;
    limit_req_zone  $binary_remote_addr  zone=auth_limit:10m   rate=10r/m;
    limit_req_zone  $binary_remote_addr  zone=widget_limit:10m rate=120r/m;
    limit_req_zone  $binary_remote_addr  zone=grafana_limit:5m rate=30r/m;
    limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ── Логирование ───────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"referer":"$http_referer",'
            '"ua":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Производительность ────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    reset_timedout_connection on;

    gzip              on;
    gzip_types        text/plain application/json application/javascript
                      text/css application/xml text/javascript
                      application/wasm image/svg+xml;
    gzip_min_length   1024;
    gzip_comp_level   4;
    gzip_vary         on;

    client_body_timeout    12;
    client_header_timeout  12;
    send_timeout           10;
    client_max_body_size   10M;
    client_body_buffer_size 16k;

    proxy_buffering    on;
    proxy_buffer_size  8k;
    proxy_buffers      8 8k;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream aqi_app {
        server app:8080;
        keepalive 32;
    }

    # Grafana: резолвится через Docker DNS в момент запроса, а не при старте nginx.
    # Это позволяет nginx запускаться до того как grafana поднимется.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ════════════════════════════════════════════════════════════════════════════
    # HTTP (порт 80) — только ACME-challenge и редирект на HTTPS
    # ════════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        # Docker healthcheck — возвращает 200 без обращения к backend
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Let's Encrypt ACME-challenge (certbot webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Всё остальное — редирект на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ════════════════════════════════════════════════════════════════════════════
    # HTTPS (порт 443) — основной сервер
    # ════════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        server_name _;

        # Сертификат Let's Encrypt (выдаётся скриптом scripts/init-letsencrypt.sh)
        ssl_certificate     /etc/letsencrypt/live/217-198-12-184.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/217-198-12-184.sslip.io/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        limit_conn conn_limit 20;

        # Docker healthcheck
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Let's Encrypt ACME-challenge (для обновления через certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Аутентификация — жёсткий rate limit
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            add_header Retry-After 60 always;
            proxy_pass         http://aqi_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_connect_timeout  10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://aqi_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_connect_timeout  60s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }

        # Виджет
        location /widget/ {
            limit_req zone=widget_limit burst=30 nodelay;
            proxy_pass         http://aqi_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Prometheus метрики
        location = /metrics {
            proxy_pass http://aqi_app;
            access_log off;
        }

        # Ready check
        location = /ready {
            proxy_pass http://aqi_app;
            access_log off;
        }

        # Grafana — proxy через переменную чтобы nginx стартовал без grafana
        location /grafana/ {
            limit_req zone=grafana_limit burst=10 nodelay;
            set $grafana_upstream http://grafana:3000;
            proxy_pass         $grafana_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 300s;
        }

        # Статические файлы React SPA (долгий кэш — хеш в имени файла)
        location ~* \.(js|css|woff2?|ttf|ico|png|jpg|svg|wasm)$ {
            root       /var/www/spa;
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # React SPA — все остальные маршруты отдают index.html
        location / {
            root      /var/www/spa;
            index     index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
