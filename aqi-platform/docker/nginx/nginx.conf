worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# Ограничение числа открытых файловых дескрипторов
worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Безопасность ─────────────────────────────────────────────────────────
    server_tokens off;
    server_name_in_redirect off;

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m    rate=60r/m;
    limit_req_zone  $binary_remote_addr  zone=auth_limit:10m   rate=10r/m;
    limit_req_zone  $binary_remote_addr  zone=widget_limit:10m rate=120r/m;
    limit_req_zone  $binary_remote_addr  zone=grafana_limit:5m rate=30r/m;
    limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ── Логирование ───────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"referer":"$http_referer",'
            '"ua":"$http_user_agent",'
            '"x_request_id":"$http_x_request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Производительность ────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    reset_timedout_connection on;

    # Сжатие
    gzip              on;
    gzip_types        text/plain application/json application/javascript
                      text/css application/xml text/javascript
                      application/wasm image/svg+xml;
    gzip_min_length   1024;
    gzip_comp_level   4;
    gzip_vary         on;

    # ── Защита от медленных атак (Slowloris) ──────────────────────────────────
    client_body_timeout    12;
    client_header_timeout  12;
    send_timeout           10;
    client_max_body_size   10M;
    client_body_buffer_size 16k;

    # Буферизация upstream-ответов
    proxy_buffering    on;
    proxy_buffer_size  8k;
    proxy_buffers      8 8k;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream aqi_app {
        server app:8080;
        keepalive 32;
    }

    upstream aqi_grafana {
        server grafana:3000;
        keepalive 8;
    }

    # ════════════════════════════════════════════════════════════════════════════
    # HTTP — ОСНОВНОЙ СЕРВЕР (обслуживает сайт напрямую без редиректа на HTTPS)
    #
    # Причина: самоподписанный сертификат вызывает ERR_CONNECTION_ABORTED
    # в Chrome 58+ и мобильных браузерах (требуется SAN, без него обход
    # предупреждения невозможен). Когда получите сертификат Let's Encrypt —
    # замените этот блок на редирект: return 301 https://$host$request_uri;
    # ════════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        # ── Лимиты соединений ──────────────────────────────────────────────────
        limit_conn conn_limit 20;

        # ── Health check (для Docker healthcheck и watchdog) ──────────────────
        # Возвращает 200 напрямую — без обращения к backend.
        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
            access_log off;
        }

        # Let's Encrypt ACME challenge (нужен для получения реального сертификата)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ── Аутентификация (жёсткий rate limiting) ────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            add_header Retry-After 60 always;

            proxy_pass         http://aqi_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   Connection        "";
            proxy_connect_timeout  10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # ── API (общий лимит) ──────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://aqi_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   Connection        "";
            proxy_connect_timeout  60s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }

        # ── Виджет (публичный) ────────────────────────────────────────────────
        location /widget/ {
            limit_req zone=widget_limit burst=30 nodelay;

            proxy_pass         http://aqi_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_valid  200 60s;
        }

        # ── Prometheus метрики ────────────────────────────────────────────────
        location = /metrics {
            proxy_pass http://aqi_app;
            access_log off;
        }

        # ── Health/ready из приложения ────────────────────────────────────────
        location = /ready {
            proxy_pass http://aqi_app;
            access_log off;
        }

        # ── Grafana ───────────────────────────────────────────────────────────
        location /grafana/ {
            limit_req zone=grafana_limit burst=10 nodelay;

            proxy_pass         http://aqi_grafana;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # WebSocket для live-обновлений Grafana
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 300s;
        }

        # ── React SPA (статика с кэшированием) ───────────────────────────────
        location ~* \.(js|css|woff2?|ttf|ico|png|jpg|svg|wasm)$ {
            root    /var/www/spa;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── React SPA (роутинг) ───────────────────────────────────────────────
        location / {
            root      /var/www/spa;
            index     index.html;
            try_files $uri $uri/ /index.html;
            # index.html не кэшируем — браузер всегда должен получать свежий
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ════════════════════════════════════════════════════════════════════════════
    # HTTPS — ДОПОЛНИТЕЛЬНЫЙ СЕРВЕР (для пользователей, вводящих https://)
    #
    # Доступен, но основной точкой входа является HTTP (порт 80).
    # HSTS не включён — чтобы браузер не блокировал HTTP-доступ.
    # Когда получите сертификат Let's Encrypt — активируйте HSTS и редирект.
    # ════════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        # ── TLS ───────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ssl_stapling отключён: требует полную цепочку сертификатов (CA).
        # Включить только при наличии сертификата от Let's Encrypt.

        # ── Заголовки безопасности ────────────────────────────────────────────
        # HSTS отключён, пока используется самоподписанный сертификат.
        # С Let's Encrypt: add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                              always;
        add_header X-Frame-Options           "SAMEORIGIN"                           always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

        # ── Лимиты соединений ─────────────────────────────────────────────────
        limit_conn conn_limit 20;

        # ── Health check ──────────────────────────────────────────────────────
        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
            access_log off;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ── Аутентификация ────────────────────────────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            add_header Retry-After 60 always;

            proxy_pass         http://aqi_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   Connection        "";
            proxy_connect_timeout  10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # ── API ───────────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://aqi_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   Connection        "";
            proxy_connect_timeout  60s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }

        # ── Виджет ────────────────────────────────────────────────────────────
        location /widget/ {
            limit_req zone=widget_limit burst=30 nodelay;

            proxy_pass         http://aqi_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_valid  200 60s;
        }

        # ── Prometheus метрики ────────────────────────────────────────────────
        location = /metrics {
            proxy_pass http://aqi_app;
            access_log off;
        }

        location = /ready {
            proxy_pass http://aqi_app;
            access_log off;
        }

        # ── Grafana ───────────────────────────────────────────────────────────
        location /grafana/ {
            limit_req zone=grafana_limit burst=10 nodelay;

            proxy_pass         http://aqi_grafana;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 300s;
        }

        # ── React SPA (статика) ───────────────────────────────────────────────
        location ~* \.(js|css|woff2?|ttf|ico|png|jpg|svg|wasm)$ {
            root    /var/www/spa;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── React SPA (роутинг) ───────────────────────────────────────────────
        location / {
            root      /var/www/spa;
            index     index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
