# AQI Platform — Docker Compose (продакшн)
# Запуск: docker compose up -d
# Установка: bash scripts/install.sh
#
# Политики безопасности:
#   - security_opt: no-new-privileges:true  — запрет повышения привилегий
#   - cap_drop: [ALL]                        — минимальный набор capabilities
#   - read_only: true + tmpfs               — файловая система только для чтения
#   - Все сервисы в изолированной сети, порты не открыты напрямую
#   - Единственная точка входа — Nginx (80/443)

name: aqi-platform

x-logging: &default-logging
  # Ограничение размера лог-файлов: не более 50 МБ × 5 файлов = 250 МБ на сервис
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

x-security: &base-security
  # Базовые параметры безопасности для всех сервисов
  security_opt:
    - no-new-privileges:true  # процесс не может получить больше привилегий чем при старте

services:
  # ── React SPA builder ───────────────────────────────────────────────────────
  # Init-контейнер: собирает фронтенд и кладёт собранные файлы в volume spa_dist.
  # Nginx подхватывает volume и отдаёт статику напрямую без Node.js в продакшне.
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: spa          # stage 2 финального Alpine-образа
    container_name: aqi_frontend_builder
    volumes:
      - spa_dist:/data     # монтируем пустой volume в /data
    # Копируем собранные файлы из /spa (image) → /data (volume)
    command: sh -c "cp -rT /spa/ /data/"
    # После копирования контейнер завершается — это нормально.
    restart: "no"
    <<: *base-security
    logging: *default-logging

  # ── Приложение ─────────────────────────────────────────────────────────────
  # Сборка из локальных исходников — не требует внешних реестров образов.
  # Контекст сборки: каталог aqi-platform/ (где лежит go.mod).
  # Dockerfile: aqi-platform/docker/Dockerfile
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VERSION: "${APP_VERSION:-dev}"
        BUILD_TIME: "${BUILD_TIME:-unknown}"
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
    image: aqi-platform:local
    container_name: aqi_app
    # always: перезапускать при любом сбое, включая перезагрузку сервера
    restart: always
    # Graceful shutdown: ждём 30 сек до принудительного kill
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Сервер
      AQI_SERVER_HOST:     "0.0.0.0"
      AQI_SERVER_PORT:     "8080"
      AQI_SERVER_BASE_URL: "${BASE_URL:-http://localhost}"
      # База данных
      AQI_DATABASE_HOST:     "postgres"
      AQI_DATABASE_PORT:     "5432"
      AQI_DATABASE_NAME:     "aqi"
      AQI_DATABASE_USER:     "aqi"
      AQI_DATABASE_PASSWORD: "${DB_PASSWORD}"
      AQI_DATABASE_SSL_MODE: "disable"
      AQI_DATABASE_MIGRATIONS_PATH: "/app/migrations"
      # Redis
      AQI_REDIS_ADDR:     "redis:6379"
      AQI_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      # Аутентификация
      AQI_AUTH_JWT_SECRET: "${JWT_SECRET}"
      # Email (опционально)
      AQI_EMAIL_IMAP_HOST:     "${IMAP_HOST:-}"
      AQI_EMAIL_IMAP_USER:     "${IMAP_USER:-}"
      AQI_EMAIL_IMAP_PASSWORD: "${IMAP_PASSWORD:-}"
      AQI_EMAIL_SMTP_HOST:     "${SMTP_HOST:-}"
      AQI_EMAIL_SMTP_PORT:     "${SMTP_PORT:-587}"
      AQI_EMAIL_SMTP_USER:     "${SMTP_USER:-}"
      AQI_EMAIL_SMTP_PASS:     "${SMTP_PASS:-}"
      AQI_EMAIL_FROM_ADDR:     "${SMTP_FROM:-}"
      # AQI-алерты (опционально)
      AQI_ALERT_ENABLED:           "${ALERT_ENABLED:-false}"
      AQI_ALERT_THRESHOLD:         "${ALERT_THRESHOLD:-101}"
      AQI_ALERT_COOLDOWN_DURATION: "${ALERT_COOLDOWN:-4h}"
      # Логирование
      AQI_LOG_LEVEL:  "info"
      AQI_LOG_FORMAT: "json"
    volumes:
      - app_data:/data
    networks:
      - aqi_internal
    # Реальный HTTP health check — проверяем что сервер отвечает на /health
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    # Ограничение ресурсов + гарантии минимума
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
        reservations:
          memory: 64M
    # Безопасность: запрет повышения привилегий + минимальные capabilities
    <<: *base-security
    cap_drop:
      - ALL       # убираем все Linux capabilities
    cap_add:
      - NET_BIND_SERVICE  # нужно для привязки к 8080 (хотя > 1024, на всякий случай)
    logging: *default-logging

  # ── PostgreSQL + TimescaleDB ────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: aqi_postgres
    restart: always
    stop_grace_period: 60s  # даём PostgreSQL время завершить транзакции
    environment:
      POSTGRES_DB:       "aqi"
      POSTGRES_USER:     "aqi"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      # Оптимизация PostgreSQL для сервера с 1–4 GB RAM
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=ru_RU.UTF-8"
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c wal_buffers=8MB
        -c max_connections=50
        -c log_min_duration_statement=1000
        -c log_timezone=Europe/Moscow
        -c timezone=Europe/Moscow
        -c ssl=off
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aqi_internal
    # Порты PostgreSQL НЕ открыты наружу — только внутри сети aqi_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqi -d aqi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    <<: *base-security
    logging: *default-logging

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aqi_redis
    restart: always
    stop_grace_period: 10s
    command: >
      redis-server
        --requirepass "${REDIS_PASSWORD}"
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --save 300 100
        --appendonly yes
        --appendfsync everysec
        --protected-mode yes
        --bind 0.0.0.0
        --loglevel notice
    volumes:
      - redis_data:/data
    networks:
      - aqi_internal
    # Порты Redis НЕ открыты наружу — только внутри сети aqi_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 160M
    <<: *base-security
    cap_drop:
      - ALL
    cap_add:
      - SETUID   # нужно entrypoint-скрипту Alpine для переключения на пользователя redis
      - SETGID
    logging: *default-logging

  # ── Backup (pg_dump каждые 6 часов) ───────────────────────────────────────
  # Использует docker-entrypoint: запускает cron + хранит бэкапы в volume backup_data.
  # Хранит последние 30 дней (BACKUP_KEEP_DAYS).
  backup:
    image: postgres:17-alpine
    container_name: aqi_backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:       "postgres"
      DB_PORT:       "5432"
      DB_NAME:       "aqi"
      DB_USER:       "aqi"
      DB_PASSWORD:   "${DB_PASSWORD}"
      BACKUP_DIR:    "/backups"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-30}"
    volumes:
      - backup_data:/backups
      - ../scripts/backup.sh:/scripts/backup.sh:ro
    # Бесконечный цикл: первый бэкап через 6 ч, затем каждые 6 ч.
    # crond не используется: в postgres:17-alpine директория crontabs отсутствует,
    # из-за чего `crontab -` завершается с ошибкой и контейнер падает.
    command: >
      sh -c "
        chmod +x /scripts/backup.sh &&
        echo 'Сервис бэкапа запущен. Расписание: каждые 6 часов' &&
        while true; do
          sleep 21600
          /scripts/backup.sh >> /var/log/backup.log 2>&1 ||
            echo \"[ERROR $(date '+%Y-%m-%d %H:%M:%S')] backup.sh завершился с ошибкой\" >> /var/log/backup.log
        done
      "
    networks:
      - aqi_internal
    deploy:
      resources:
        limits:
          memory: 128M
    <<: *base-security
    logging: *default-logging

  # ── Prometheus (сбор метрик) ───────────────────────────────────────────────
  # Prometheus НЕ имеет открытых портов наружу — доступен только через Grafana.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aqi_prometheus
    restart: always
    stop_grace_period: 30s
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.wal-compression'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.external-url=${BASE_URL:-http://localhost}/prometheus/'
      - '--web.route-prefix=/'  # маршруты на корне, external-url только для ссылок
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - aqi_internal
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    <<: *base-security
    cap_drop:
      - ALL
    logging: *default-logging

  # ── Grafana (визуализация метрик) ──────────────────────────────────────────
  # Grafana НЕ имеет открытых портов наружу — проксируется через Nginx /grafana/.
  grafana:
    image: grafana/grafana:11.2.0
    container_name: aqi_grafana
    restart: always
    stop_grace_period: 15s
    environment:
      GF_SECURITY_ADMIN_USER:          "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD:      "${GRAFANA_PASSWORD:-changeme}"
      GF_USERS_ALLOW_SIGN_UP:          "false"
      GF_USERS_ALLOW_ORG_CREATE:       "false"
      GF_AUTH_ANONYMOUS_ENABLED:       "false"  # анонимный доступ запрещён
      GF_SERVER_ROOT_URL:              "${BASE_URL:-http://localhost}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH:   "true"
      GF_SECURITY_COOKIE_SECURE:       "true"   # HTTPS-only cookies
      GF_SECURITY_COOKIE_SAMESITE:     "strict"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_SECURITY_X_CONTENT_TYPE_OPTIONS: "true"
      GF_SECURITY_X_XSS_PROTECTION:   "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL:                    "warn"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - aqi_internal
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
    <<: *base-security
    logging: *default-logging

  # ── Nginx (reverse proxy + TLS + SPA) ─────────────────────────────────────
  # ЕДИНСТВЕННАЯ точка входа из интернета — порты 80 и 443
  nginx:
    image: nginx:1.27-alpine
    container_name: aqi_nginx
    restart: always
    stop_grace_period: 15s
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
      grafana:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      - spa_dist:/var/www/spa:ro    # собранный React SPA
    networks:
      - aqi_internal
    healthcheck:
      # HTTP-блок делает 301 → HTTPS, поэтому проверяем напрямую HTTPS.
      # --no-check-certificate нужен для самоподписанного сертификата.
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
    <<: *base-security
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Nginx нужно привязаться к портам < 1024
      - CHOWN             # Nginx нужно создавать временные файлы
      - SETUID            # переключение на непривилегированный worker
      - SETGID
      - DAC_OVERRIDE      # чтение файлов из volumes
    logging: *default-logging

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_data:
    driver: local
  nginx_certs:
    driver: local
  nginx_logs:
    driver: local
  spa_dist:
    driver: local    # хранит собранный React SPA (заполняется frontend-сервисом)
  backup_data:
    driver: local    # хранит pg_dump-бэкапы (30 дней)
  prometheus_data:
    driver: local    # хранит TSDB Prometheus (90 дней метрик)
  grafana_data:
    driver: local    # хранит настройки и кастомные дашборды Grafana

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  aqi_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24  # фиксированная подсеть для предсказуемости
