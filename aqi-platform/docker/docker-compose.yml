# AQI Platform — Docker Compose (продакшн)
# Запуск: docker compose up -d
# Установка: bash scripts/install.sh

name: aqi-platform

services:
  # ── React SPA builder ───────────────────────────────────────────────────────
  # Init-контейнер: собирает фронтенд и кладёт собранные файлы в volume spa_dist.
  # Nginx подхватывает volume и отдаёт статику напрямую без Node.js в продакшне.
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: spa          # stage 2 финального Alpine-образа
    container_name: aqi_frontend_builder
    volumes:
      - spa_dist:/data     # монтируем пустой volume в /data
    # Копируем собранные файлы из /spa (image) → /data (volume)
    command: sh -c "cp -rT /spa/ /data/"
    # После копирования контейнер завершается — это нормально.
    restart: "no"

  # ── Приложение ─────────────────────────────────────────────────────────────
  app:
    image: ghcr.io/mintfary/aqi-platform:${APP_VERSION:-latest}
    container_name: aqi_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Сервер
      AQI_SERVER_HOST:     "0.0.0.0"
      AQI_SERVER_PORT:     "8080"
      AQI_SERVER_BASE_URL: "${BASE_URL:-http://localhost}"
      # База данных
      AQI_DATABASE_HOST:     "postgres"
      AQI_DATABASE_PORT:     "5432"
      AQI_DATABASE_NAME:     "aqi"
      AQI_DATABASE_USER:     "aqi"
      AQI_DATABASE_PASSWORD: "${DB_PASSWORD}"
      AQI_DATABASE_SSL_MODE: "disable"
      AQI_DATABASE_MIGRATIONS_PATH: "/app/migrations"
      # Redis
      AQI_REDIS_ADDR:     "redis:6379"
      AQI_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      # Аутентификация
      AQI_AUTH_JWT_SECRET: "${JWT_SECRET}"
      # Email (опционально)
      AQI_EMAIL_IMAP_HOST:     "${IMAP_HOST:-}"
      AQI_EMAIL_IMAP_USER:     "${IMAP_USER:-}"
      AQI_EMAIL_IMAP_PASSWORD: "${IMAP_PASSWORD:-}"
      # Логирование
      AQI_LOG_LEVEL:  "info"
      AQI_LOG_FORMAT: "json"
    volumes:
      - app_data:/data
    networks:
      - aqi_internal
    healthcheck:
      test: ["/app/aqi-platform", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Ограничение ресурсов
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
        reservations:
          memory: 64M

  # ── PostgreSQL + TimescaleDB ────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: aqi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       "aqi"
      POSTGRES_USER:     "aqi"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      # Оптимизация PostgreSQL для сервера с 1–4 GB RAM
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=ru_RU.UTF-8"
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c wal_buffers=8MB
        -c max_connections=50
        -c log_min_duration_statement=1000
        -c log_timezone=Europe/Moscow
        -c timezone=Europe/Moscow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aqi_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqi -d aqi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Данные наружу не открываем — только через приложение
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aqi_redis
    restart: unless-stopped
    command: >
      redis-server
        --requirepass "${REDIS_PASSWORD}"
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --save 300 100
        --appendonly no
    volumes:
      - redis_data:/data
    networks:
      - aqi_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 160M

  # ── Backup (pg_dump каждые 6 часов) ───────────────────────────────────────
  # Использует docker-entrypoint: запускает cron + хранит бэкапы в volume backup_data.
  # Хранит последние 30 дней (BACKUP_KEEP_DAYS).
  backup:
    image: postgres:17-alpine
    container_name: aqi_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:       "postgres"
      DB_PORT:       "5432"
      DB_NAME:       "aqi"
      DB_USER:       "aqi"
      DB_PASSWORD:   "${DB_PASSWORD}"
      BACKUP_DIR:    "/backups"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-30}"
    volumes:
      - backup_data:/backups
      - ../scripts/backup.sh:/scripts/backup.sh:ro
    # Запускаем crond (Alpine): каждые 6 часов в 02:00, 08:00, 14:00, 20:00
    command: >
      sh -c "
        chmod +x /scripts/backup.sh &&
        echo '0 2,8,14,20 * * * /scripts/backup.sh >> /var/log/backup.log 2>&1' | crontab - &&
        echo 'Сервис бэкапа запущен. Расписание: каждые 6 часов' &&
        crond -f -d 8
      "
    networks:
      - aqi_internal
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Nginx (reverse proxy + TLS + SPA) ─────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: aqi_nginx
    restart: unless-stopped
    depends_on:
      - app
      - frontend    # ждём копирования SPA-файлов в volume
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      - spa_dist:/var/www/spa:ro    # собранный React SPA
    networks:
      - aqi_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_data:
    driver: local
  nginx_certs:
    driver: local
  nginx_logs:
    driver: local
  spa_dist:
    driver: local    # хранит собранный React SPA (заполняется frontend-сервисом)
  backup_data:
    driver: local    # хранит pg_dump-бэкапы (30 дней)

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  aqi_internal:
    driver: bridge
    # Изоляция: контейнеры не выставляют порты наружу напрямую
    internal: false
