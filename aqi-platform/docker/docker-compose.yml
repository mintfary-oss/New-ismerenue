# AQI Platform — Docker Compose (продакшн)
# Запуск: docker compose up -d
# Установка: bash scripts/install.sh

name: aqi-platform

services:
  # ── Приложение ─────────────────────────────────────────────────────────────
  app:
    image: ghcr.io/mintfary/aqi-platform:${APP_VERSION:-latest}
    container_name: aqi_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Сервер
      AQI_SERVER_HOST:     "0.0.0.0"
      AQI_SERVER_PORT:     "8080"
      AQI_SERVER_BASE_URL: "${BASE_URL:-http://localhost}"
      # База данных
      AQI_DATABASE_HOST:     "postgres"
      AQI_DATABASE_PORT:     "5432"
      AQI_DATABASE_NAME:     "aqi"
      AQI_DATABASE_USER:     "aqi"
      AQI_DATABASE_PASSWORD: "${DB_PASSWORD}"
      AQI_DATABASE_SSL_MODE: "disable"
      AQI_DATABASE_MIGRATIONS_PATH: "/app/migrations"
      # Redis
      AQI_REDIS_ADDR:     "redis:6379"
      AQI_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      # Аутентификация
      AQI_AUTH_JWT_SECRET: "${JWT_SECRET}"
      # Email (опционально)
      AQI_EMAIL_IMAP_HOST:     "${IMAP_HOST:-}"
      AQI_EMAIL_IMAP_USER:     "${IMAP_USER:-}"
      AQI_EMAIL_IMAP_PASSWORD: "${IMAP_PASSWORD:-}"
      # Логирование
      AQI_LOG_LEVEL:  "info"
      AQI_LOG_FORMAT: "json"
    volumes:
      - app_data:/data
    networks:
      - aqi_internal
    healthcheck:
      test: ["/app/aqi-platform", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Ограничение ресурсов
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
        reservations:
          memory: 64M

  # ── PostgreSQL + TimescaleDB ────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: aqi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       "aqi"
      POSTGRES_USER:     "aqi"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      # Оптимизация PostgreSQL для сервера с 1–4 GB RAM
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=ru_RU.UTF-8"
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c wal_buffers=8MB
        -c max_connections=50
        -c log_min_duration_statement=1000
        -c log_timezone=Europe/Moscow
        -c timezone=Europe/Moscow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aqi_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqi -d aqi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Данные наружу не открываем — только через приложение
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aqi_redis
    restart: unless-stopped
    command: >
      redis-server
        --requirepass "${REDIS_PASSWORD}"
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --save 300 100
        --appendonly no
    volumes:
      - redis_data:/data
    networks:
      - aqi_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 160M

  # ── Nginx (reverse proxy + TLS) ────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: aqi_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - aqi_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_data:
    driver: local
  nginx_certs:
    driver: local
  nginx_logs:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  aqi_internal:
    driver: bridge
    # Изоляция: контейнеры не выставляют порты наружу напрямую
    internal: false
