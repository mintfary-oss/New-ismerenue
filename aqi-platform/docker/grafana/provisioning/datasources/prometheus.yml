# Grafana — автоматическое подключение Prometheus как источника данных.
# Файл читается при старте Grafana и создаёт datasource без ручной настройки.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: '2.54.0'
      timeInterval: '15s'
